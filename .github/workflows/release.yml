# Release workflow: builds KonGUI from a version tag and publishes a GitHub release.
#
# It does NOT publish to PyPI (the old workflow of the Konsave project did, using
# the upstream's package name). Alphas, betas and release candidates are published
# as GitHub *pre-releases*. How it works, what it checks and how to try it is in
# docs/RELEASING.md.
#
# Files: the wheel, the sdist, install.sh, an AppImage (+ .zsync) for x86_64 and
# for aarch64, SHA256SUMS of all of them, SHA256SUMS.asc (its GPG signature) and
# kongui-signing-key.asc (the public key). The AppImages also carry an embedded
# signature. The key comes from two repository secrets, KONGUI_SIGNING_KEY (the
# armored secret key) and KONGUI_SIGNING_PASSPHRASE; without them a tag fails:
# nothing is published unsigned.
#
# "Run workflow" (workflow_dispatch) is a dry run of any branch: it builds and
# checks everything, signs only if the key is there, and publishes nothing; the
# files are kept as the run's artifacts.
name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

env:
  IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and check the files
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools_scm needs the history and the tags
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag and that its commit is on master
        if: env.IS_TAG == 'true'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # PEP 440, the forms used here: 1.2.3, 1.2.3a1, 1.2.3b1, 1.2.3rc1
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::The tag '$tag' is not a version (v0.1.0a1, v0.1.0rc1, v0.1.0)."
            exit 1
          fi
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::The tag is not on master. Merge dev into master first (docs/RELEASING.md)."
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build

      - name: Read the version from the files (and check it matches the tag)
        id: version
        run: |
          set -euo pipefail
          ls dist
          wheel="$(ls dist/kongui-*-py3-none-any.whl)"
          version="$(basename "$wheel" | cut -d- -f2)"
          if [ "$IS_TAG" = "true" ]; then
            test "$version" = "${GITHUB_REF_NAME#v}" || { echo "::error::wheel $version does not match the tag"; exit 1; }
            test -f "dist/kongui-${version}.tar.gz" || { echo "::error::sdist name does not match the tag"; exit 1; }
          fi
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then prerelease=true; else prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building $version (pre-release: $prerelease, tag: $IS_TAG)"

      - name: Install the wheel in a clean environment and smoke-test it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "dist/kongui-${VERSION}-py3-none-any.whl"
          cd /tmp   # not the checkout: the installed package must be the one tested
          /tmp/clean/bin/python "$GITHUB_WORKSPACE/tools/smoke_test.py" --no-gui --expect-version "$VERSION"

      - name: Install the wheel with install.sh in a clean home, then remove it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          # Without PySide6 here (KONGUI_EXTRAS=""): the GUI part is covered by
          # the smoke test of a user's machine, not by the runner.
          HOME="$home" KONGUI_EXTRAS="" bash install.sh --wheel "dist/kongui-${VERSION}-py3-none-any.whl"
          test -L "$home/.local/bin/kongui"
          grep -q "^Exec=$home/.venvs/kongui/bin/kongui$" "$home/.local/share/applications/kongui.desktop"
          grep -qx "Icon=kongui" "$home/.local/share/applications/kongui.desktop"
          test -f "$home/.local/share/icons/hicolor/scalable/apps/kongui.svg"
          test -f "$home/.local/share/icons/hicolor/48x48/apps/kongui.png"
          HOME="$home" bash install.sh --uninstall
          test ! -e "$home/.venvs/kongui"
          test ! -e "$home/.local/share/icons/hicolor/scalable/apps/kongui.svg"

      - name: Add install.sh (published with the release)
        run: cp install.sh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  appimage:
    name: AppImage (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30   # a hung step fails here, not after GitHub's 6 hours
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      HAS_KEY: ${{ secrets.KONGUI_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install the build and check tools
        run: |
          set -euo pipefail
          sudo apt-get update -q
          # zsync: the .zsync update file; the rest: Qt's offscreen platform for
          # the smoke test of the AppImage's own Python.
          sudo apt-get install -y -q zsync libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Import the signing key
        env:
          KEY: ${{ secrets.KONGUI_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEY" != "true" ]; then
            if [ "$IS_TAG" = "true" ]; then
              echo "::error::KONGUI_SIGNING_KEY is not set: a release is never published unsigned (docs/RELEASING.md)."
              exit 1
            fi
            echo "::warning::No signing key: this dry run builds unsigned AppImages."
            exit 0
          fi
          printf '%s\n' "$KEY" | gpg --batch --import
          fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          echo "SIGN_KEY=$fingerprint" >> "$GITHUB_ENV"
          echo "Signing with $fingerprint"

      - name: Build the AppImage from the release wheel
        env:
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.KONGUI_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEY" = "true" ]; then export SIGN=1; fi
          if [ "$IS_TAG" = "true" ]; then
            # A pre-release follows every newer release, pre or not; a stable
            # release only stable ones.
            if [ "$PRERELEASE" = "true" ]; then channel=latest-all; else channel=latest; fi
            export UPDATE_INFORMATION="gh-releases-zsync|${GITHUB_REPOSITORY_OWNER}|${GITHUB_REPOSITORY#*/}|${channel}|KonGUI-*-${ARCH}.AppImage.zsync"
            echo "UPDATE_INFORMATION=$UPDATE_INFORMATION" >> "$GITHUB_ENV"
          fi
          packaging/appimage/build.sh "dist/kongui-${VERSION}-py3-none-any.whl"
          ls -la dist/appimage

      - name: Smoke-test the AppImage
        run: |
          set -euo pipefail
          appimage="$PWD/dist/appimage/KonGUI-${VERSION}-${ARCH}.AppImage"
          home="$(mktemp -d)"
          mkdir -p "$home/.cache" "$home/.config"
          export HOME="$home" QT_QPA_PLATFORM=offscreen
          # The runner has no FUSE: extract-and-run for the app itself. Every
          # call has a time limit, so a call that opens the window fails fast.
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 300 "$appimage" konsave -v
          cd "$home"
          timeout 300 "$appimage" --appimage-extract >/dev/null
          python_dir="$(echo squashfs-root/opt/python3.*)"   # one folder: opt/python3.NN
          timeout 300 "$python_dir/bin/$(basename "$python_dir")" -s \
            "$GITHUB_WORKSPACE/tools/smoke_test.py" --expect-version "$VERSION"
          if [ "$IS_TAG" = "true" ]; then
            # NOT with APPIMAGE_EXTRACT_AND_RUN: with it the runtime ignores its
            # own --appimage-* option and starts KonGUI, which never ends
            # offscreen (it hung the first v0.1.0a4 run).
            test "$(timeout 60 "$appimage" --appimage-updateinformation)" = "$UPDATE_INFORMATION"
            test -s "${appimage}.zsync"
          fi

      - name: Check the embedded signature
        if: env.HAS_KEY == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o validate.AppImage \
            "https://github.com/AppImageCommunity/AppImageUpdate/releases/download/continuous/validate-${ARCH}.AppImage"
          chmod +x validate.AppImage
          # validate writes its report to stderr: keep both in the log.
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 300 ./validate.AppImage \
            "dist/appimage/KonGUI-${VERSION}-${ARCH}.AppImage" 2>&1 | tee validate.log
          grep -q "Validation result: validation successful" validate.log
          grep -q "$SIGN_KEY" validate.log

      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: |
            dist/appimage/KonGUI-*.AppImage
            dist/appimage/KonGUI-*.AppImage.zsync
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [build, appimage]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and attach the files
    steps:
      - uses: actions/checkout@v4   # for the notes; no history needed
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write and sign the checksums, add the public key
        env:
          KEY: ${{ secrets.KONGUI_SIGNING_KEY }}
          PASSPHRASE: ${{ secrets.KONGUI_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$KEY" || { echo "::error::KONGUI_SIGNING_KEY is not set."; exit 1; }
          printf '%s\n' "$KEY" | gpg --batch --import
          fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          cd dist
          ls -la
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$fingerprint" --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS
          gpg --armor --export "$fingerprint" > kongui-signing-key.asc
          echo "Signed with $fingerprint"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "KonGUI $VERSION" \
            --notes-file .github/release-notes.md \
            "${flags[@]}"
