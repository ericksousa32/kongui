# Release workflow: builds KonGUI from a version tag and publishes a GitHub release.
#
# It does NOT publish to PyPI (the old workflow of the Konsave project did, using
# the upstream's package name). Alphas, betas and release candidates are published
# as GitHub *pre-releases*. How it works, what it checks and how to try it is in
# docs/RELEASING.md.
name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    name: Build and check the files
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools_scm needs the history and the tags
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read the version from the tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # PEP 440, the forms used here: 1.2.3, 1.2.3a1, 1.2.3b1, 1.2.3rc1
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::The tag '$tag' is not a version (v0.1.0a1, v0.1.0rc1, v0.1.0)."
            exit 1
          fi
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then prerelease=true; else prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (pre-release: $prerelease)"

      - name: Check that the tagged commit is on master
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::The tag is not on master. Merge dev into master first (docs/RELEASING.md)."
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build

      - name: Check that the files carry the version of the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ls dist
          test -f "dist/kongui-${VERSION}-py3-none-any.whl" || { echo "::error::wheel name does not match the tag"; exit 1; }
          test -f "dist/kongui-${VERSION}.tar.gz" || { echo "::error::sdist name does not match the tag"; exit 1; }

      - name: Install the wheel in a clean environment and smoke-test it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "dist/kongui-${VERSION}-py3-none-any.whl"
          cd /tmp   # not the checkout: the installed package must be the one tested
          /tmp/clean/bin/python "$GITHUB_WORKSPACE/tools/smoke_test.py" --no-gui --expect-version "$VERSION"

      - name: Install the wheel with install.sh in a clean home, then remove it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          # Without PySide6 here (KONGUI_EXTRAS=""): the GUI part is covered by
          # the smoke test of a user's machine, not by the runner.
          HOME="$home" KONGUI_EXTRAS="" bash install.sh --wheel "dist/kongui-${VERSION}-py3-none-any.whl"
          test -L "$home/.local/bin/kongui"
          grep -q "^Exec=$home/.venvs/kongui/bin/kongui$" "$home/.local/share/applications/kongui.desktop"
          HOME="$home" bash install.sh --uninstall
          test ! -e "$home/.venvs/kongui"

      - name: Write the checksums (install.sh is published with the release)
        run: |
          set -euo pipefail
          cp install.sh dist/
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and attach the files
    steps:
      - uses: actions/checkout@v4   # for the notes header; no history needed
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "KonGUI $VERSION" \
            --notes-file .github/release-notes.md \
            "${flags[@]}"
